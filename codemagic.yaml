workflows:
  ios-unsigned:
    name: Build iPhone IPA (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      # Same Flutter as local development, so a new stable release cannot
      # change the build behind our back.
      flutter: 3.44.0
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Get Flutter packages
        script: |
          set -euo pipefail
          # google_mlkit_translation ships as a Swift package only.
          flutter config --enable-swift-package-manager
          flutter pub get

      - name: Analyze and test
        script: |
          set -euo pipefail
          # Deprecation notices (infos) must not stop the build.
          flutter analyze --no-fatal-infos
          # export_ffmpeg_test needs a desktop ffmpeg with libass, so it is
          # left for local runs.
          flutter test --no-pub test/core_test.dart test/key_store_test.dart test/subtitle_store_test.dart test/subtitle_file_test.dart test/lock_screen_test.dart test/watch_position_test.dart test/openrouter_test.dart test/subtitle_plan_test.dart test/subtitle_runs_test.dart test/subtitle_picker_test.dart test/web_video_test.dart test/hls_proxy_test.dart test/bookmarks_test.dart test/net_test.dart test/app_settings_test.dart test/browser_tabs_test.dart test/browser_screen_test.dart test/audit_fixes_test.dart test/retained_audio_test.dart test/retained_audio_resume_test.dart test/audio_availability_test.dart test/full_audio_download_test.dart test/crop_picture_test.dart test/subtitle_revision_widget_test.dart test/video_pipeline_test.dart test/scheduling_test.dart test/page_translation_test.dart test/import_feedback_test.dart test/vercel_credits_test.dart test/background_subtitles_test.dart test/subtitle_completion_test.dart test/folder_navigation_test.dart
          # The page script (JavaScript injected into web pages) has its own tests.
          if command -v node >/dev/null; then node --test test/page_script_test.mjs; fi

      - name: Build iOS app without signing
        script: |
          set -euo pipefail
          plutil -lint ios/Runner/Info.plist
          rm -rf build/ios
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 \
            --build-number="$BUILD_NUMBER"
          test -d build/ios/iphoneos/Runner.app
          # ML Kit translation crashes without its resource bundle.
          test -d build/ios/iphoneos/Runner.app/MLKitTranslate_resource.bundle
          file build/ios/iphoneos/Runner.app/Runner | grep -q arm64

      - name: Create unsigned IPA
        script: |
          set -euo pipefail
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          ditto -c -k --sequesterRsrc --keepParent Payload Video-Sub-unsigned.ipa
          unzip -tq Video-Sub-unsigned.ipa
          ls -lh Video-Sub-unsigned.ipa

    artifacts:
      - build/ios/ipa/*.ipa
